<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — Bonsai Swarm</title>
<meta name="description" content="Chat with Ternary Bonsai 2 27B, answered by a volunteer's GPU. Pay in AI Coins you earned by sharing your own.">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<main class="wrap" style="padding-top:22px">
  <div class="chat-shell">
    <aside class="convs">
      <button id="new-chat" class="btn-sm" style="width:100%;justify-content:center;margin-bottom:8px">+ New chat</button>
      <div id="conversations"></div>
    </aside>

    <section>
      <div class="spread" style="margin-bottom:10px">
        <div class="row small">
          <span id="network-dot" class="dot"></span><span id="network" class="muted">checking the swarm…</span>
        </div>
        <div class="row small muted">
          <a class="btn btn-sm ghost" href="/share.html" id="balance-hint">Earn AI Coins</a>
        </div>
      </div>

      <div id="messages" class="thread"></div>

      <div class="composer">
        <div class="box">
          <textarea id="input" rows="1" placeholder="Ask the swarm…"></textarea>
          <button id="stop" hidden class="btn-sm">Stop</button>
          <button id="send" class="primary btn-sm">Send</button>
        </div>
        <div class="row small muted" style="margin-top:9px;justify-content:space-between">
          <label style="margin:0;display:flex;gap:7px;align-items:center;cursor:pointer">
            <input type="checkbox" id="thinking" style="width:auto"> show reasoning
          </label>
          <span class="hide-sm">Enter sends · Shift+Enter for a new line</span>
          <span>Answers are generated on volunteers' machines — never send personal or secret data. The model is small and can be confidently wrong.</span>
        </div>
      </div>
    </section>
  </div>
</main>
<script type="module" src="/js/chat.js"></script>
</body>
</html>
